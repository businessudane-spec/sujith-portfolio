<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Sujith Balan</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #070301;
            --text-color: #f7f4f2;
            --accent-orange: #ff5a1f;
            --accent-glow: rgba(255, 90, 31, 0.15);
            --font-sans: 'Outfit', sans-serif;
            --font-mono: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 2rem;
        }

        .glow-sphere {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(7, 3, 1, 0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            filter: blur(45px);
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .error-code {
            font-family: var(--font-mono);
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.05em;
            color: var(--accent-orange);
            text-shadow: 0 0 40px rgba(255, 90, 31, 0.35);
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        p {
            font-size: 1rem;
            color: #a3a3a3;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background-color: #ffffff;
            color: #070301;
            text-decoration: none;
            padding: 0.9rem 2rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            background-color: #eaeaea;
        }

        .home-btn .arrow {
            transition: transform 0.3s ease;
        }

        .home-btn:hover .arrow {
            transform: translateX(-4px);
        }
    </style>
</head>
<body>
    <div class="glow-sphere"></div>

    <div class="container">
        <div class="error-code">404</div>
        <h1>Lost in Orbit</h1>
        <p>The page you are looking for has been moved, removed, or is temporarily unavailable. Let's get you back on track.</p>

        <a href="index.html" class="home-btn">
            <span class="arrow">←</span>
            <span>Return to Safety</span>
        </a>
    </div>
</body>
</html>
